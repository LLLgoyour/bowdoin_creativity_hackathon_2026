<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>the press takes commissions</title>
<style>
/* +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
The page is a sheet of paper and the machine printed on it. There is no markup
here to style: every instrument, every label and every moving part on screen is
drawn by the workshop modules in the press's own three inks, on this paper, with the
same halftone screens as the sheet it produces. The only thing in the body is
the canvas the machine is printed on, one offscreen file input (the plumbing
behind a physical hotspot - a file picker cannot be drawn), and the scripts.
+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ */
:root{ --paper:#f3ecdd; --ink:#241a12; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
  color:var(--ink);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{display:block;width:100vw;height:100vh}
/* the file picker is the one thing a canvas cannot draw. It is never shown:
   the source desk and press feed board both open it. The source desk loads a
   record directly; the press leaves a physical file on its feed board. */
#f_any{position:fixed;left:-4px;top:-4px;width:1px;height:1px;opacity:0;border:0;
  padding:0;margin:0;pointer-events:none}
</style></head><body>
<canvas id="stage"></canvas>
<input id="f_any" type="file" aria-hidden="true" tabindex="-1">
<!-- classic scripts, in load order: works straight off file:// -->
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   core.js — shared vocabulary. DOM-free, dependency-free, loaded first.
   Everything in src/ may use these; nothing in src/ may redefine them.
   ═══════════════════════════════════════════════════════════════════════════ */

/* the flats a paper card may be printed in — one palette for the whole app */
const PAL = ['#f6c344','#e8563f','#3f8fe0','#57ac4a','#8a63d2','#e08a3c',
             '#3fb8a0','#d4527e','#a9c93f','#5a7fd8','#f2efe4','#8a6a4a'];
const INK = '#2a1a10';                      /* the cut-paper outline */

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function h2(x,y){let h=Math.imul(x|0,73856093)^Math.imul(y|0,19349663);h^=h>>>13;
  h=Math.imul(h,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function mulberry32(a){return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
/* one colour format in the palette: every entry is #rrggbb, so anything that
   reads a colour — the press separates each one into ink — can parse it */
function mixHex(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);
  return'#'+[0,1,2].map(i=>Math.round(lerp(A[i],B[i],t)).toString(16).padStart(2,'0')).join('');}
function decodeF64(b64){
  const bin=(typeof atob!=='undefined')?atob(b64):Buffer.from(b64,'base64').toString('binary');
  const n=bin.length,u=new Uint8Array(n);
  for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i);
  return new Float64Array(u.buffer);
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ── registries ──────────────────────────────────────────────────────────────
   A field builder turns a record into w*h of geometry.
   A world is a local rule that turns that geometry into something alive. */
const FIELDS=[], WORLDS=[];
function defField(o){FIELDS.push(o);}          /* o = {id,label,blurb,build} */
function defWorld(o){WORLDS.push(o);}          /* see CONTRACT.md for o's shape */
function fieldById(id){return FIELDS.find(f=>f.id===id)||FIELDS[0];}
function worldById(id){return WORLDS.find(w=>w.id===id)||WORLDS[0];}

/* ── the view: what a world hands the renderer every frame ───────────────────
   Fixed-shape typed arrays, allocated once, reused forever. No per-frame
   allocation anywhere in the hot path. */
function newView(n){return{
  n, live:new Uint8Array(n),      /* 1 = a card stands here                       */
  col:new Uint8Array(n),          /* palette index (0..PAL.length-1)              */
  face:new Uint8Array(n),         /* 1 = the card has grown eyes                  */
  flip:new Float32Array(n),       /* 0..1 paper-flip progress (1 = edge-on, gone) */
  lift:new Float32Array(n),       /* vertical offset in cells (negative = up)     */
  spin:new Float32Array(n),       /* -1..1 lean, in radians/3                     */
  stack:new Uint8Array(n),        /* extra cards under the top one (0 = single)   */
  spark:new Float32Array(n)};}    /* 0..1 starburst                                */
function clearView(V){V.live.fill(0);V.col.fill(0);V.face.fill(0);
  V.flip.fill(0);V.lift.fill(0);V.spin.fill(0);V.stack.fill(0);V.spark.fill(0);}
function viewLive(V){let c=0;for(let i=0;i<V.n;i++)if(V.live[i])c++;return c;}
</script>
<script>
/* Pure record -> geometry. Helpers stay private; only the four parsers escape. */
const {parseNumeric, prepRecord, makeNoise, fieldFromImage,
  waveContour, waveFit, waveFromImage, waveAudio, decimate, WAVE_N, WAVE_AUDIO} = (() => {
  const math = Math, bound = clamp, blend = lerp;
  const TAU = 2 * math.PI;

  function parseNumeric(text) {
    const rows = [];
    let columns = 0;
    for (const line of String(text).split(/\r?\n/)) {
      const s = line.trim();
      if (!s || s[0] === '#' || s[0] === ';' || s[0] === '%') continue;
      const parts = s.split('#', 1)[0].trim().split(/[\s,;]+/);
      const values = parts.map(Number);
      if (!values.length || !values.every(Number.isFinite)) continue;
      const width = math.min(3, values.length);
      if (!columns) columns = width;
      if (width !== columns) continue;
      rows.push(values);
    }
    if (!rows.length) throw new Error('No numeric rows found.');
    const re = new Float64Array(rows.length), im = new Float64Array(rows.length);
    const t = new Float64Array(rows.length);
    for (let i = 0; i < rows.length; i++) {
      t[i] = columns === 3 ? rows[i][0] : i;
      re[i] = rows[i][columns === 3 ? 1 : 0];
      im[i] = columns === 3 ? rows[i][2] : columns === 2 ? rows[i][1] : 0;
    }
    return {re, im, t, kind:columns === 1 ? 'numeric' : 'complex'};
  }

  function quadrature(samples) {
    let size = 1;
    while (size < samples.length) size *= 2;
    const re = new Float64Array(size), im = new Float64Array(size);
    re.set(samples);
    fft(re, im);
    for (let i = 1; i < size / 2; i++) {re[i] *= 2; im[i] *= 2;}
    for (let i = (size >> 1) + 1; i < size; i++) {re[i] = 0; im[i] = 0;}
    for (let i = 0; i < size; i++) im[i] = -im[i];
    fft(re, im);
    const result = new Float64Array(samples.length);
    for (let i = 0; i < result.length; i++) result[i] = -im[i] / size;
    return result;
  }

  function imageSeries(obj) {
    const {rgba, width, height} = obj;
    if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1 || !rgba || rgba.length !== width * height * 4)
      throw new Error('Image pixels do not match their source dimensions.');
    let side = 1;
    while (side < math.max(width, height)) side *= 2;
    const re = new Float64Array(side * side), t = new Float64Array(side * side);
    for (let d = 0; d < re.length; d++) {
      let x = 0, y = 0, index = d;
      for (let scale = 1; scale < side; scale *= 2) {
        const rx = (index >> 1) & 1, ry = (index ^ rx) & 1;
        if (!ry) {
          if (rx) {x = scale - 1 - x; y = scale - 1 - y;}
          const swap = x; x = y; y = swap;
        }
        x += scale * rx; y += scale * ry; index >>= 2;
      }
      const sx = math.floor(x * width / side), sy = math.floor(y * height / side), p = (sy * width + sx) * 4;
      re[d] = (0.2126 * rgba[p] + 0.7152 * rgba[p + 1] + 0.0722 * rgba[p + 2]) * rgba[p + 3] / 65025;
      t[d] = d;
    }
    return {re, im:quadrature(re), t, timeUnit:'Hilbert steps', frequencyUnit:'cycles/Hilbert-step', provenance:'Image luminance follows a ' + side + '×' + side +
      ' Hilbert-curve scan (neighbour-preserving nearest resampling from ' + width + '×' + height +
      '); phase is analytic quadrature and frequency is cycles per Hilbert step, not physical Hz.'};
  }

  function audioSeries(obj) {
    if (!Number.isFinite(obj.sr) || obj.sr <= 0 || !obj.samples || !obj.samples.length)
      throw new Error('Audio needs mono samples and a positive sample rate.');
    const re = Float64Array.from(obj.samples), t = new Float64Array(re.length), amp = new Float64Array(re.length);
    const radius = math.max(1, math.round(obj.sr * 0.01));
    let left = 0, right = 0, energy = 0;
    for (let i = 0; i < re.length; i++) {
      if (!Number.isFinite(re[i])) throw new Error('Audio samples must be finite.');
      const end = math.min(re.length, i + radius + 1), start = math.max(0, i - radius);
      while (right < end) {energy += re[right] * re[right]; right++;}
      while (left < start) {energy -= re[left] * re[left]; left++;}
      amp[i] = math.sqrt(math.max(0, energy / (right - left))); t[i] = i / obj.sr;
    }
    return {re, im:quadrature(re), t, amp, timeUnit:'s', frequencyUnit:'Hz', provenance:'Mono audio at ' + obj.sr +
      ' samples/s; analytic Hilbert quadrature supplies phase, amplitude is a centred 20 ms RMS loudness envelope, and frequency is Hz.'};
  }

  function prepRecord(obj) {
    const kind = obj.kind || (obj.samples ? 'audio' : obj.rgba ? 'image' : obj.im == null ? 'numeric' : 'complex');
    if (!['numeric', 'complex', 'noise', 'image', 'audio'].includes(kind)) throw new Error('Unknown record kind: ' + kind);
    let envelope = null;
    if (kind === 'image') Object.assign(obj, imageSeries(obj));
    else if (kind === 'audio') {
      const decoded = audioSeries(obj);
      envelope = decoded.amp;
      const stated = obj.provenance;      /* a caller that described the file keeps its own wording */
      Object.assign(obj, decoded);
      if (stated) obj.provenance = stated;
    }
    const re = typeof obj.re === 'string' ? decodeF64(obj.re) : obj.re instanceof Float64Array ? obj.re : Float64Array.from(obj.re);
    const n = re.length;
    if (!n) throw new Error('The record is empty.');
    const im = typeof obj.im === 'string' ? decodeF64(obj.im) : obj.im == null ? new Float64Array(n) : obj.im instanceof Float64Array ? obj.im : Float64Array.from(obj.im);
    const t = typeof obj.t === 'string' ? decodeF64(obj.t) : obj.t == null ? Float64Array.from({length:n}, (_, i) => i) : obj.t instanceof Float64Array ? obj.t : Float64Array.from(obj.t);
    if (im.length !== n || t.length !== n) throw new Error('Record columns have different lengths.');
    const amp = new Float64Array(n), ph = new Float64Array(n);
    let amax = 0, previous = 0, accumulated = 0, origin = 0;
    for (let i = 0; i < n; i++) {
      if (!Number.isFinite(re[i]) || !Number.isFinite(im[i]) || !Number.isFinite(t[i])) throw new Error('Record values must be finite.');
      if (i && t[i] <= t[i - 1]) throw new Error('Record times must increase.');
      amp[i] = kind === 'image' ? re[i] : envelope ? envelope[i] : math.hypot(re[i], im[i]);
      amax = math.max(amax, amp[i]);
      const angle = math.atan2(im[i], re[i]);
      if (!i) origin = accumulated = angle;
      else {
        let delta = angle - previous;
        while (delta > math.PI) delta -= TAU;
        while (delta < -math.PI) delta += TAU;
        accumulated += delta;
      }
      ph[i] = accumulated;
      previous = angle;
    }
    if (kind === 'numeric' && amax) {
      for (let i = 0; i < n; i++) amp[i] /= amax;
      amax = 1;
    }
    const provenance = obj.provenance || (kind === 'noise' ? 'Seeded smoothed complex noise.' :
      kind === 'numeric' ? 'Numeric samples; amplitude is normalised magnitude.' : 'Complex samples; amplitude is complex magnitude.');
    return Object.assign(obj, {kind, provenance, re, im, t, amp, ph, amax, turns:math.abs(accumulated - origin) / TAU});
  }

  function makeNoise(seed) {
    const n = 773, rng = mulberry32(seed >>> 0);
    const re = new Float64Array(n), im = new Float64Array(n), t = new Float64Array(n);
    let a = 0, b = 0, c = 0, d = 0;
    for (let i = 0; i < n; i++) {
      a = 0.985 * a + (rng() - 0.5) * 0.9;
      b = 0.94 * b + (rng() - 0.5) * 0.5;
      c = 0.985 * c + (rng() - 0.5) * 0.9;
      d = 0.94 * d + (rng() - 0.5) * 0.5;
      re[i] = a + b; im[i] = c + d; t[i] = 0.780 + i * 0.3900156;
    }
    return {re, im, t, kind:'noise', name:'smoothed noise'};
  }

  function blank(w, h, id, label, note) {
    if (!Number.isInteger(w) || !Number.isInteger(h) || w < 1 || h < 1) throw new Error('Grid dimensions must be positive integers.');
    const n = w * h;
    return {w, h, id, label, note, amp:new Float32Array(n), ph:new Float32Array(n),
      freq:new Float32Array(n), mask:new Uint8Array(n), occ:new Float32Array(n)};
  }

  function occupancy(F, rec) {
    const {w, h, mask, occ} = F;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
        sum += mask[((y + dy + h) % h) * w + (x + dx + w) % w];
      occ[y * w + x] = sum / 9;
    }
    if (rec && rec.provenance) F.note += ' ' + rec.provenance;
    return F;
  }

  function frequencies(rec) {
    const n = rec.re.length, raw = new Float64Array(n), norm = new Float64Array(n);
    let min = Infinity, max = -Infinity, scale = 0;
    for (let i = 0; i < n; i++) {
      const a = math.max(0, i - 1), b = math.min(n - 1, i + 1);
      const value = a === b ? 0 : (rec.ph[b] - rec.ph[a]) / (TAU * (rec.t[b] - rec.t[a]));
      raw[i] = value;
      min = math.min(min, value); max = math.max(max, value); scale = math.max(scale, math.abs(value));
    }
    for (let i = 0; i < n; i++) norm[i] = scale ? raw[i] / scale : 0;
    return {raw, norm, min, max};
  }

  function geometryRecord(rec, count) {
    const n = rec.re.length;
    if (rec.smooth || n <= 4 * count) return rec;
    const re = new Float64Array(count), im = new Float64Array(count), t = new Float64Array(count);
    const amp = new Float64Array(count), ph = new Float64Array(count);
    for (let block = 0; block < count; block++) {
      const start = math.floor(block * n / count), end = math.floor((block + 1) * n / count), scale = 1 / (end - start);
      let r = 0, z = 0, time = 0, a = 0, phase = 0;
      for (let i = start; i < end; i++) {r += rec.re[i]; z += rec.im[i]; time += rec.t[i]; a += rec.amp[i]; phase += rec.ph[i];}
      re[block] = r * scale; im[block] = z * scale; t[block] = time * scale;
      amp[block] = a * scale; ph[block] = phase * scale;
    }
    return {...rec, re, im, t, amp, ph, provenance:rec.provenance + ' Geometry block-averages all ' + n +
      ' samples into ' + count + ' contiguous blocks; the frequency fields retain full-rate samples.'};
  }

  function path(rec, w, h) {
    rec = geometryRecord(rec, w * h);
    const F = blank(w, h, 'path', 'THE RECORD ITSELF',
      'x and y are Re h and Im h; brightness is sample amplitude: the record’s own path, ' +
      rec.turns.toFixed(2) + ' net turns, with fixed 4× supersampling and a ' +
      math.max(1, 0.5 * w / 240).toFixed(1) + '-cell brush radius.');
    const n = rec.re.length, fr = frequencies(rec), divisor = rec.amax || 1;
    let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
    for (let i = 0; i < n; i++) {
      xmin = math.min(xmin, rec.re[i]); xmax = math.max(xmax, rec.re[i]);
      ymin = math.min(ymin, rec.im[i]); ymax = math.max(ymax, rec.im[i]);
    }
    const scale = 0.92 * math.max(0, math.min(w - 1, h - 1)) / (math.max(xmax - xmin, ymax - ymin) || 1);
    const cx = (xmin + xmax) / 2, cy = (ymin + ymax) / 2, W = w * 4, H = h * 4;
    const count = new Uint32Array(W * H), amps = new Float64Array(W * H), freq = new Float64Array(W * H);
    const phase = new Float64Array(W * H), last = new Float64Array(W * H);
    const radius = 4 * math.max(1, 0.5 * w / 240), r2 = radius * radius;
    for (let j = 0; j < math.max(1, n - 1); j++) {
      const a = j, b = math.min(n - 1, j + 1);
      const ax = 4 * ((w - 1) / 2 + (rec.re[a] - cx) * scale) + 2;
      const ay = 4 * ((h - 1) / 2 - (rec.im[a] - cy) * scale) + 2;
      const bx = 4 * ((w - 1) / 2 + (rec.re[b] - cx) * scale) + 2;
      const by = 4 * ((h - 1) / 2 - (rec.im[b] - cy) * scale) + 2;
      const dx = bx - ax, dy = by - ay, length2 = dx * dx + dy * dy;
      const x0 = math.max(0, math.floor(math.min(ax, bx) - radius)), x1 = math.min(W - 1, math.ceil(math.max(ax, bx) + radius));
      const y0 = math.max(0, math.floor(math.min(ay, by) - radius)), y1 = math.min(H - 1, math.ceil(math.max(ay, by) + radius));
      const aa = rec.amp[a], ab = rec.amp[b], fa = fr.norm[a], fb = fr.norm[b], pa = rec.ph[a], pb = rec.ph[b];
      for (let y = y0; y <= y1; y++) {
        // A capsule only touches the part of a row near the segment, not its entire bounding box.
        const ta = dy ? bound((y + 0.5 - radius - ay) / dy, 0, 1) : 0;
        const tb = dy ? bound((y + 0.5 + radius - ay) / dy, 0, 1) : 1;
        const left = math.max(x0, math.floor(math.min(ax + ta * dx, ax + tb * dx) - radius));
        const right = math.min(x1, math.ceil(math.max(ax + ta * dx, ax + tb * dx) + radius));
        for (let x = left; x <= right; x++) {
        const t = length2 ? bound(((x + 0.5 - ax) * dx + (y + 0.5 - ay) * dy) / length2, 0, 1) : 0;
        const ex = x + 0.5 - ax - t * dx, ey = y + 0.5 - ay - t * dy;
        if (ex * ex + ey * ey > r2) continue;
        const i = y * W + x;
        count[i]++;
        amps[i] += blend(aa, ab, t) / divisor;
        freq[i] += blend(fa, fb, t);
        phase[i] = blend(pa, pb, t); last[i] = j + t;
      }
      }
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      let on = 0, amp = 0, f = 0, latest = -1;
      for (let dy = 0; dy < 4; dy++) for (let dx = 0; dx < 4; dx++) {
        const k = (y * 4 + dy) * W + x * 4 + dx;
        if (!count[k]) continue;
        on++; amp += amps[k] / count[k]; f += freq[k] / count[k];
        if (last[k] > latest) {latest = last[k]; F.ph[i] = phase[k];}
      }
      if (on) {F.mask[i] = 1; F.amp[i] = amp / on; F.freq[i] = f / on;}
    }
    return occupancy(F, rec);
  }

  function gapMedian(rec, count, ordinal) {
    if (rec.re.length < 2 || count < 2) return 0;
    const n = rec.re.length, k = math.min(ordinal, count - 1);
    const indices = new Int32Array(count), gaps = new Float64Array(count), best = new Float64Array(k);
    for (let i = 0; i < count; i++) indices[i] = math.round(i * (n - 1) / (count - 1));
    for (let i = 0; i < count; i++) {
      best.fill(Infinity);
      const a = indices[i];
      for (let j = 0; j < count; j++) {
        if (i === j) continue;
        const b = indices[j], dr = rec.re[a] - rec.re[b], di = rec.im[a] - rec.im[b], d = dr * dr + di * di;
        if (d >= best[k - 1]) continue;
        let rank = k - 1;
        while (rank && best[rank - 1] > d) {best[rank] = best[rank - 1]; rank--;}
        best[rank] = d;
      }
      gaps[i] = math.sqrt(best[k - 1]);
    }
    gaps.sort();
    return (gaps[(count - 1) >> 1] + gaps[count >> 1]) / 2;
  }

  function matrix(rec, w, h, PAR) {
    const original = rec;
    rec = geometryRecord(rec, math.max(w, h));
    const k = math.max(1, Number.isFinite(PAR && PAR.k) ? math.round(PAR.k) : 4);
    const F = blank(w, h, 'matrix', 'SELF-SIMILARITY', '');
    const n = rec.re.length, fr = frequencies(rec), divisor = rec.amax || 1;
    const cols = new Int32Array(w), distances = new Float64Array(w * h);
    const rawSpace = PAR && PAR.gapSpace === 'raw', sampleCount = rawSpace ? original.re.length : w;
    const eps = gapMedian(rawSpace ? original : rec, sampleCount, k), eps2 = eps * eps;
    for (let x = 0; x < w; x++) cols[x] = math.round(x * (n - 1) / math.max(1, w - 1));
    for (let y = 0; y < h; y++) {
      const a = math.round(y * (n - 1) / math.max(1, h - 1));
      let best = Infinity, link = a;
      for (let x = 0; x < w; x++) {
        const b = cols[x], dr = rec.re[a] - rec.re[b], di = rec.im[a] - rec.im[b], distance = dr * dr + di * di;
        distances[y * w + x] = distance;
        if (a !== b) {
          if (distance < best) {best = distance; link = b;}
        }
      }
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        F.amp[i] = rec.amp[a] / divisor; F.ph[i] = rec.ph[a];
        F.freq[i] = (fr.norm[a] + fr.norm[link]) / 2;
      }
    }
    const raw = new Uint8Array(w * h), dilated = new Uint8Array(w * h);
    for (let i = 0; i < raw.length; i++) raw[i] = distances[i] <= eps2 ? 1 : 0;
    /* Closing is dilation followed by erosion, both with a 3×3 toroidal box.
       Do not union kNN polylines or retain the intermediate dilation. */
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let on = 0;

  /* ══ file → wave ══════════════════════════════════════════════════════════

     of the P largest-magnitude DFT harmonics of that contour — the epicycles

    for (let i = 0; i < cursor; i++) {mx += x[i]; my += y[i];}
    mx /= cursor; my /= cursor;
    for (let i = 0; i < cursor; i++) {x[i] -= mx; y[i] -= my;}
    return {x, y, crossings, loops:keep.length, ox:mx, oy:my};
  }

  /* Even-odd scanline fill of the reconstructed closed curve, compared with
     the thresholded frame it came from: how much of the picture the record's
     own trajectory still covers. The record is centred on its contour, so the
     frame offset is put back before the comparison. */
  function outlineIoU(rx, ry, ox, oy, lum, w, h, level, invert) {
    const n = rx.length, fill = new Uint8Array(w * h), xs = new Float64Array(n);
    let inter = 0, union = 0;
    for (let y = 0; y < h; y++) {
      let m = 0;
      for (let i = 0; i < n; i++) {
        const k = (i + 1) % n, ay = h - 1 - (ry[i] + oy), by = h - 1 - (ry[k] + oy);
        if ((ay <= y) === (by <= y)) continue;
        const ax = rx[i] + ox, bx = rx[k] + ox;
        xs[m++] = ax + (bx - ax) * (y - ay) / (by - ay);
      }
      const row = Array.prototype.slice.call(xs, 0, m).sort((a, b) => a - b);
      for (let s = 0; s + 1 < row.length; s += 2) {
        const from = math.max(0, math.ceil(row[s])), to = math.min(w - 1, math.floor(row[s + 1]));
        for (let x = from; x <= to; x++) fill[y * w + x] = 1;
      }
    }
    for (let i = 0; i < fill.length; i++) {
      const source = (lum[i] < level) !== invert ? 1 : 0;
      inter += source & fill[i];
      union += source | fill[i];
    }
    return union ? inter / union : 0;
  }

  /* The record is the sum of the P largest harmonics of the contour:
     h(t) = Σ A_k e^{i(ω_k t + φ_k)}, resampled from the DFT at the contour's
     own parameter values. DC is dropped — the contour is centred on it. */
  function dftFit(zr, zi, P) {
    const N = zr.length, sr = Float64Array.from(zr), si = Float64Array.from(zi);
    fft(sr, si);
    const mag = new Float64Array(N);
    for (let k = 1; k < N; k++) mag[k] = sr[k] * sr[k] + si[k] * si[k];
    const order = new Array(N - 1);
    for (let i = 0; i < N - 1; i++) order[i] = i + 1;
    order.sort((a, b) => (mag[b] - mag[a]) || (a - b));   /* magnitude, then bin */
    const take = bound(P, 1, N - 1), re = new Float64Array(N), im = new Float64Array(N), bins = new Int32Array(take);
    for (let i = 0; i < take; i++) {
      const k = order[i], omega = TAU * k / N, cw = math.cos(omega), sw = math.sin(omega);
      bins[i] = k;
      let cr = 1, ci = 0;
      for (let j = 0; j < N; j++) {
        re[j] += sr[k] * cr - si[k] * ci;
        im[j] += sr[k] * ci + si[k] * cr;
        const next = cr * cw - ci * sw; ci = cr * sw + ci * cw; cr = next;
      }
    }
    const scale = 1 / N;
    for (let j = 0; j < N; j++) {re[j] *= scale; im[j] *= scale;}
    let sum = 0, worst = 0;
    for (let j = 0; j < N; j++) {
      const d = (re[j] - zr[j]) * (re[j] - zr[j]) + (im[j] - zi[j]) * (im[j] - zi[j]);
      sum += d;
      worst = math.max(worst, d);
    }
    return {re, im, bins, take, rms:math.sqrt(sum / N), max:math.sqrt(worst), maxP:N - 1};
  }

  /* Stage one: pixels → one complex contour (the expensive half, cacheable). */
  function waveContour(obj) {
    if (!obj || !obj.rgba || !Number.isInteger(obj.width) || !Number.isInteger(obj.height) || obj.width < 1 || obj.height < 1 ||
        obj.rgba.length !== obj.width * obj.height * 4)
      throw new Error('An image wave needs rgba pixels that match their width and height.');
    const frame = reduceFrame(obj.rgba, obj.width, obj.height, WAVE_SIDE);
    const cut = levelOtsu(frame.lum);
    const found = marchingLoops(frame.lum, frame.w, frame.h, cut.level, cut.invert, 0.0004 * frame.w * frame.h, WAVE_LOOPS);
    if (!found.length) throw new Error('That image has no closed contour at the Otsu level ' + cut.level.toFixed(4) + '.');
    const c = resampleLoops(found, WAVE_N);
    return {x:c.x, y:c.y, n:WAVE_N, frame, level:cut.level, invert:cut.invert, ox:c.ox, oy:c.oy,
      loops:c.loops, crossings:c.crossings, area:found.reduce((s, L) => s + L.area, 0),
      name:obj.name || 'image', source:{w:obj.width, h:obj.height}};
  }

  /* Stage two: contour → the record, at harmonic count P. */
  function waveFit(contour, P) {
    const fit = dftFit(contour.x, contour.y, P);
    const iou = outlineIoU(fit.re, fit.im, contour.ox, contour.oy, contour.frame.lum, contour.frame.w, contour.frame.h, contour.level, contour.invert);
    const n = contour.n, t = new Float64Array(n);
    for (let i = 0; i < n; i++) t[i] = i / n;         /* one turn = one traversal */
    const f = contour.frame;
    return {
      kind:'complex', name:contour.name, re:fit.re, im:fit.im, t,
      timeUnit:'turns', frequencyUnit:'cycles/turn',
      wave:{kind:'image', file:contour.name, P:fit.take, maxP:fit.maxP, rms:fit.rms, max:fit.max,
        iou, points:n, loops:contour.loops, crossings:contour.crossings, level:contour.level,
        invert:contour.invert, frame:f.w + '×' + f.h, source:contour.source.w + '×' + contour.source.h},
      provenance:'IMAGE → WAVE. ' + contour.source.w + '×' + contour.source.h + ' in, analysed at ' + f.w + '×' + f.h +
        ', thresholded at the Otsu level ' + contour.level.toFixed(4) + ' on the ' + (contour.invert ? 'light' : 'dark') +
        ' side; ' + contour.loops + ' closed traversal' + (contour.loops === 1 ? '' : 's') + ' (' + contour.crossings +
        ' crossings) were concatenated and resampled to ' + n + ' uniform arc-length samples. The record is the sum of its ' +
        fit.take + ' largest-magnitude DFT harmonics of ' + fit.maxP + ' nonzero bins (DC dropped: the contour is centred on it), ' +
        'so re/im is the picture: RMS ' + fit.rms.toFixed(3) + ' px, max ' + fit.max.toFixed(3) +
        ' px, silhouette IoU ' + iou.toFixed(4) + '. Time is in traversals and frequency in cycles/turn.'
    };
  }

  function waveFromImage(obj, P) {return waveFit(waveContour(obj), P);}

  /* Box-average a long signal onto equal integer blocks — the reduction rule
     for long records — so a minute of 44.1 kHz audio becomes a record the
     panels and the fields can still afford. */
  function decimate(samples, want) {
    const n = samples.length;
    if (n <= want) return {samples:Float64Array.from(samples), factor:1};
    const factor = math.ceil(n / want), m = math.floor(n / factor), out = new Float64Array(m);
    for (let i = 0; i < m; i++) {
      let sum = 0;
      for (let j = 0; j < factor; j++) sum += samples[i * factor + j];
      out[i] = sum / factor;
    }
    return {samples:out, factor};
  }

  /* Audio is the one file kind that was already a wave: the record is its
     analytic signal x + i·H(x) (the Hilbert transform by FFT — negative
     frequencies zeroed, positives doubled), which is prepRecord's own audio
     path. A long file is box-averaged onto WAVE_AUDIO samples first and keeps
     the reduced sample rate, so the sound's frequency axes still mean Hz. */
  const WAVE_AUDIO = 8192;

  function waveAudio(obj, want) {
    if (!obj || !obj.samples || !obj.samples.length) throw new Error('An audio wave needs decoded mono samples.');
    const cut = decimate(obj.samples, want || WAVE_AUDIO), rate = obj.sr / cut.factor;
    const note = obj.name || 'audio';
    return {
      kind:'audio', name:note, samples:cut.samples, sr:rate,
      wave:{kind:'audio', file:note, source:obj.samples.length, sr:obj.sr, points:cut.samples.length,
        factor:cut.factor, rate},
      provenance:'AUDIO → WAVE. ' + note + ' is ' + obj.samples.length + ' samples at ' + obj.sr +
        ' samples/s; box-averaged by ' + cut.factor + ' onto ' + cut.samples.length + ' samples at ' + rate.toFixed(2) +
        ' samples/s, and re/im is that signal\u2019s analytic signal x + i·H(x) — the Hilbert transform by FFT, negative ' +
        'frequencies zeroed and positives doubled — so the wave IS the sound. Amplitude is a centred 20 ms RMS loudness ' +
        'envelope; time is s and frequency is Hz.'
    };
  }

  defField({id:'path', label:'THE RECORD ITSELF', blurb:'The complex-plane trajectory, not a timeline.', build:path});
  defField({id:'matrix', label:'SELF-SIMILARITY', blurb:'Fixed-radius recurrence, closed rather than dilated.',
    params:[{key:'gapSpace', label:'gap sample space', def:'grid',
      options:[{value:'grid', label:'board samples'}, {value:'raw', label:'original samples'}]},
      {key:'k', label:'gap neighbour rank', min:1, max:16, step:1, def:4}], build:matrix});
  defField({id:'spectro', label:'SPECTROGRAM', blurb:'A signed, band-zoomed windowed frequency map.', build:spectro});
  defField({id:'hst', label:'HILBERT SPECTRUM', blurb:'The unwindowed frequency ridge, including reversals.', build:hst});
  return {parseNumeric, prepRecord, makeNoise, fieldFromImage,
    waveContour, waveFit, waveFromImage, waveAudio, decimate, WAVE_N, WAVE_AUDIO};   /* file → wave */
})();

<script>
/* Kuramoto dynamics on the record's induced four-neighbour graph, with wrap.
   omega = detune * (0.35*freq + spread_eff*(amp - mean masked amp)) radians
   per simulation-time unit. Coupling is the mean over PRESENT neighbours only.
   spread_eff = spread*(w*h/2704)^0.25. This is the smallest tested exponent
   (0,.15,.25,.35,.5) keeping GSFC path locking below 90% at 52, 76 and 120.
   Euler substeps preserve h and keep dt*(2*K + drive) <= 0.9; a second bound
   limits relative natural rotation so bond crossings cannot alias by a turn.
   Geometry and pin phases are immutable until init; freq, amp and PAR stay live. */
(() => {
  const PI = Math.PI, TAU = 2 * PI, OMEGA = 0.35;
  const {sin, cos, sqrt, floor, ceil, max, abs} = Math;

  // Exact coherence ordering; ties favour the lower cell index deterministically.
  function weaker(r, i, j) { return r[i] < r[j] || (r[i] === r[j] && i > j); }

  function present(S, field, advance) {
    const {active, degree, neighbours, cs, sn, localR, V, faceHeap} = S;
    let locked = 0, sumC = 0, sumS = 0, faces = 0;
    for (let a = 0; a < active.length; a++) {
      const i = active[a], count = degree[a], offset = a * 4;
      let c = 0, s = 0;
      for (let b = 0; b < count; b++) {
        const j = neighbours[offset + b];
        c += cs[j];
        s += sn[j];
      }
      if (count) { c /= count; s /= count; }
      const r = sqrt(c * c + s * s), was = localR[i], isLocked = r > 0.9;
      // Isolated cells have no local order, but still show their own rhythm.
      if (!count) { c = cs[i]; s = sn[i]; }
      // Exact 45-degree octants, spanning the complete circle, without atan2.
      V.col[i] = s >= 0
        ? (c >= 0 ? (s < c ? 4 : 5) : (s > -c ? 6 : 7))
        : (c < 0 ? (-s < -c ? 0 : 1) : (-s > c ? 2 : 3));
      if (advance) S.lockAge[a] = r > 0.99 ? Math.min(20, S.lockAge[a] + 1) : 0;
      V.face[i] = 0;
      V.lift[i] = -0.05 * field.amp[i];
      if (advance) {
        V.flip[i] = S.slipped[a] ? 1 : max(0, V.flip[i] - 0.12);
        V.spark[i] = isLocked && was <= 0.9 ? 1 : max(0, V.spark[i] - 0.12);
      }
      localR[i] = r;
      // Even r>.99 sustained for 20 generations covers 51–63% of GSFC cards.
      // Keep the strongest eligible fifth: eyes distinguish deep domain cores,
      // rather than decorating almost every oscillator. Storage is reused.
      if (S.lockAge[a] >= 20 && faceHeap.length) {
        if (faces < faceHeap.length) {
          let p = faces++;
          while (p) {
            const parent = (p - 1) >> 1;
            if (!weaker(localR, i, faceHeap[parent])) break;
            faceHeap[p] = faceHeap[parent];
            p = parent;
          }
          faceHeap[p] = i;
        } else if (weaker(localR, faceHeap[0], i)) {
          let p = 0;
          while (p * 2 + 1 < faces) {
            let child = p * 2 + 1;
            if (child + 1 < faces && weaker(localR, faceHeap[child + 1], faceHeap[child])) child++;
            if (!weaker(localR, faceHeap[child], i)) break;
            faceHeap[p] = faceHeap[child];
            p = child;
          }
          faceHeap[p] = i;
        }
      }
      if (isLocked) locked++;
      sumC += cs[i];
      sumS += sn[i];
    }
    for (let a = 0; a < faces; a++) V.face[faceHeap[a]] = 1;
    S.faces = faces;
    S.locked = locked;
    S.order = S.visible ? sqrt(sumC * sumC + sumS * sumS) / S.visible : 0;
  }

  defWorld({
    id: 'synch', label: 'SYNCHRONY',
    blurb: 'Global r measures whole-board phase agreement; locally locked counts neighbour order >0.9.',
    params: [
      {key: 'K', label: 'coupling', min: 0, max: 8, step: 0.1, def: 2.4},
      {key: 'detune', label: 'record detune', min: 0, max: 4, step: 0.05, def: 1},
      {key: 'spread', label: 'energy spread', min: 0, max: 3, step: 0.05, def: 2.4},
      {key: 'drive', label: 'record pull', min: 0, max: 2, step: 0.01, def: 0.5},
      {key: 'h', label: 'step', min: 0.02, max: 0.3, step: 0.01, def: 0.1}
    ],
    init(w, h, field, rng, PAR) {
      const n = w * h;
      let visible = 0;
      for (let i = 0; i < n; i++) if (field.mask[i]) visible++;
      const S = {
        w, h, n, visible, generation: 0, order: 0, locked: 0, substeps: 1,
        rng, shakePending: false, shakeSlipBonds: 0,
        meanAmp: 0, slipBonds: 0, bonds: 0,
        spreadScale: Math.pow(n / 2704, 0.25), lockAge: new Uint8Array(visible),
        faces: 0, faceHeap: new Int32Array(floor(visible * 0.2)),
        active: new Int32Array(visible), degree: new Uint8Array(visible),
        neighbours: new Int32Array(visible * 4), bondPhase: new Float32Array(visible * 4),
        slipped: new Uint8Array(visible), theta: new Float32Array(n), next: new Float32Array(n),
        cs: new Float32Array(n), sn: new Float32Array(n),
        pinCS: new Float32Array(n), pinSN: new Float32Array(n),
        delta: new Float32Array(n), localR: new Float32Array(n), V: newView(n)
      };
      let a = 0, amplitude = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (!field.mask[i]) continue;
        S.active[a] = i;
        S.V.live[i] = 1;
        amplitude += field.amp[i];
        S.pinCS[i] = cos(field.ph[i]);
        S.pinSN[i] = sin(field.ph[i]);
        const angle = field.ph[i] + (rng() * 2 - 1) * 0.02;
        S.theta[i] = angle - floor(angle / TAU) * TAU;
        S.cs[i] = cos(S.theta[i]);
        S.sn[i] = sin(S.theta[i]);
        let count = 0;
        for (let b = 0; b < 4; b++) {
          const j = b === 0 ? y * w + (x ? x - 1 : w - 1)
            : b === 1 ? y * w + (x + 1 < w ? x + 1 : 0)
            : b === 2 ? (y ? y - 1 : h - 1) * w + x
            : (y + 1 < h ? y + 1 : 0) * w + x;
          if (field.mask[j] && j !== i) S.neighbours[a * 4 + count++] = j;
        }
        S.degree[a] = count;
        S.bonds += count;
        a++;
      }
      S.meanAmp = visible ? amplitude / visible : 0;
      for (a = 0; a < visible; a++) {
        const i = S.active[a];
        for (let b = 0; b < S.degree[a]; b++) {
          const offset = a * 4 + b, d = S.theta[S.neighbours[offset]] - S.theta[i];
          S.bondPhase[offset] = d - floor((d + PI) / TAU) * TAU;
        }
      }
      present(S, field, false);
      return S;
    },
    shake(S, field, power) {
      const kick = clamp(power, 0, 1), before = S.order, lockedBefore = S.locked;
      if (kick > 0) {
        const {active, theta, cs, sn, delta, neighbours, degree, bondPhase} = S;
        if (!S.shakePending) { S.slipped.fill(0); S.shakeSlipBonds = 0; }
        for (let a = 0; a < active.length; a++) {
          const i = active[a], d = (S.rng() * 2 - 1) * PI * kick;
          delta[i] = d;
          const angle = theta[i] + d;
          theta[i] = angle - floor(angle / TAU) * TAU;
          cs[i] = cos(theta[i]);
          sn[i] = sin(theta[i]);
        }
        let sumC = 0, sumS = 0, locked = 0;
        for (let a = 0; a < active.length; a++) {
          const i = active[a], count = degree[a];
          let c = 0, s = 0;
          for (let b = 0; b < count; b++) {
            const offset = a * 4 + b, j = neighbours[offset];
            c += cs[j]; s += sn[j];
            // Count crossings along the actual kick, including a relative jump
            // exceeding pi. Rebase the bond so the next step cannot double-count.
            const crossings = abs(floor((bondPhase[offset] + delta[j] - delta[i] + PI) / TAU));
            if (crossings) { S.slipped[a] = 1; S.shakeSlipBonds += crossings; }
            const relative = theta[j] - theta[i];
            bondPhase[offset] = relative - floor((relative + PI) / TAU) * TAU;
          }
          const r = count ? sqrt(c * c + s * s) / count : 0;
          S.localR[i] = r;
          if (r > 0.9) locked++;
          if (r <= 0.99) S.lockAge[a] = 0;
          sumC += cs[i]; sumS += sn[i];
        }
        S.order = S.visible ? sqrt(sumC * sumC + sumS * sumS) / S.visible : 0;
        S.locked = locked;
        S.shakePending = true;
      }
      // Recovery is a future observation, never a forecast in an impulse HUD.
      return 'kick ' + kick.toFixed(2) + ' · global r ' + before.toFixed(4) + '→' + S.order.toFixed(4) +
        ' · locally locked ' + lockedBefore + '→' + S.locked + '/' + S.visible;
    },
    step(S, field, PAR) {
      const K = PAR.K, detune = PAR.detune, drive = PAR.drive;
      const spread = PAR.spread * S.spreadScale;
      const rateBound = max(2 * K + drive, 2 * detune * (OMEGA + spread));
      const substeps = max(1, ceil(PAR.h * rateBound / 0.9)), dt = PAR.h / substeps;
      const {active, degree, neighbours, cs, sn, pinCS, pinSN, delta, bondPhase, slipped} = S;
      S.substeps = substeps;
      if (S.shakePending) {
        S.slipBonds = S.shakeSlipBonds;
        S.shakePending = false;
      } else {
        S.slipBonds = 0;
        slipped.fill(0);
      }
      for (let a = 0; a < active.length; a++) delta[active[a]] = 0;
      for (let k = 0; k < substeps; k++) {
        const theta = S.theta, next = S.next;
        for (let a = 0; a < active.length; a++) {
          const i = active[a], count = degree[a];
          let c = 0, s = 0;
          for (let b = 0; b < count; b++) {
            const j = neighbours[a * 4 + b];
            c += cs[j];
            s += sn[j];
          }
          const coupling = count ? (s * cs[i] - c * sn[i]) / count : 0;
          const pin = pinSN[i] * cs[i] - pinCS[i] * sn[i];
          const omega = detune * (OMEGA * field.freq[i] + spread * (field.amp[i] - S.meanAmp));
          const d = dt * (omega + K * coupling + drive * field.amp[i] * pin);
          delta[i] += d;
          const angle = theta[i] + d;
          next[i] = angle - floor(angle / TAU) * TAU;
        }
        S.theta = next;
        S.next = theta;
        for (let a = 0; a < active.length; a++) {
          const i = active[a];
          cs[i] = cos(next[i]);
          sn[i] = sin(next[i]);
          // Directed bonds count separately. A crossing and return within one
          // generation still flips the two endpoint cards, never other cells.
          for (let b = 0; b < degree[a]; b++) {
            const offset = a * 4 + b, d = next[neighbours[offset]] - next[i];
            const relative = d - floor((d + PI) / TAU) * TAU;
            if (abs(relative - bondPhase[offset]) > PI) {
              slipped[a] = 1;
              S.slipBonds++;
            }
            bondPhase[offset] = relative;
          }
        }
      }
      S.generation++;
      present(S, field, true);
    },
    stats(S) { return S.locked; },
    view(S) { return S.V; },
    HUD(S, field, PAR) {
      return 'global r ' + S.order.toFixed(2) + ' · locally locked ' + S.locked + '/' + S.visible +
        ' · K ' + PAR.K.toFixed(1);
    }
  });
})();

<script>
/* Gravity is a driven, open-boundary sandpile on the record's terrain.
   H = 1 - amp: the quietest point is one terrain unit above the loudest.
   This monotone map preserves small amplitude differences without letting the
   few loud peaks erase the record's quieter valleys. Public grains stay 0..8;
   a separate integer work buffer holds the transient avalanche in flight. */
(()=>{
function loudColumn(S){
  let x=-1,highest=-1,ties=0;
  for(let j=0;j<S.w;j++){
    if(S.selected[j])continue;
    if(S.columnAmp[j]>highest){
      highest=S.columnAmp[j];x=j;ties=1;
    }else if(S.columnAmp[j]===highest){
      ties++;if(S.rng()*ties<1)x=j;
    }
  }
  S.selected[x]=1;
  return x;
}

function relax(S,animate){
  const n=S.n,m=S.work,nb=S.neighbours,V=S.V,changed=S.changed;
  const threshold=S.toppleThreshold,queue=S.queue,queued=S.queued;
  let head=0,tail=0,pending=0;
  for(let i=0;i<n;i++){
    if(m[i]<=threshold)continue;
    queue[tail]=i;if(++tail===n)tail=0;pending++;queued[i]=1;
  }
  let waveRemaining=pending;
  if(pending)S.avalancheDuration=1;
  while(pending){
    const i=queue[head];if(++head===n)head=0;pending--;queued[i]=0;
    const count=Math.floor((m[i]-threshold+3)/4);
    m[i]-=count*4;S.avalanche+=count;changed[i]=1;
    if(animate){V.spark[i]=1;V.flip[i]=1;}
    for(let d=0;d<4;d++){
      const j=nb[i*4+d];
      if(j<0){S.out+=count;continue;}
      m[j]+=count;changed[j]=1;
      if(animate)V.lift[j]=-0.35;
      if(m[j]>threshold&&!queued[j]){
        queue[tail]=j;if(++tail===n)tail=0;pending++;queued[j]=1;
      }
    }
    if(--waveRemaining===0&&pending){
      S.avalancheDuration++;waveRemaining=pending;
    }
  }
  for(let i=n-S.w;i<n;i++){S.bottomOut+=m[i];m[i]=0;}
  S.out+=S.bottomOut;
}

function commit(S,tick){
  let mass=0,live=0;
  for(let i=0;i<S.n;i++){
    const m=S.work[i];
    S.grains[i]=m;mass+=m;
    if(m){
      live++;S.age[i]=S.changed[i]?0:Math.min(65535,S.age[i]+tick);
    }else S.age[i]=0;
  }
  S.mass=mass;S.live=live;S.gen+=tick;
  S.totalAdded+=S.added;S.totalOut+=S.out;S.totalTopples+=S.avalanche;
  if(S.avalanche){
    S.avalancheEvents++;
    if(S.avalanche>S.largestAvalanche)S.largestAvalanche=S.avalanche;
  }
}

function trackActivity(S){
  const old=S.activity[S.activityCursor];
  S.activityTotal+=S.avalanche-old;
  S.activityEvents+=(S.avalanche>0?1:0)-(old>0?1:0);
  S.activity[S.activityCursor]=S.avalanche;
  S.activityCursor=(S.activityCursor+1)&31;
  S.activityCount=Math.min(32,S.activityCount+1);
  if(!S.shakeTracking)return;
  S.shakeElapsed++;
  if(S.shakeElapsed<32)return;
  const rate=S.activityEvents/32,mean=S.activityTotal/32;
  if(Math.abs(rate-S.shakeBaselineRate)<=0.125&&
      Math.abs(mean-S.shakeBaselineTopples)<=Math.max(0.5,S.shakeBaselineTopples*0.25)){
    S.shakeRecovery=S.shakeElapsed;S.shakeTracking=0;
  }
}

defWorld({
  id:'grav', label:'GRAVITY',
  blurb:'Loud valleys collect avalanches. Eyes rank 2+ piles rested 40 generations by height, then age; at most a quarter of live piles.',
  params:[
    {key:'gravity',label:'terrain gravity',min:0,max:8,step:0.1,def:3},
    {key:'slope',label:'topple above (4-card minimum)',min:2,max:8,step:1,def:4},
    {key:'source',label:'record feed',min:0,max:1,step:0.01,def:0.18},
    {key:'sources',label:'loud source columns',min:1,max:16,step:1,def:6},
    {key:'advect',label:'phase steers falls',min:0,max:1,step:1,def:0}
  ],
  init(w,h,field,rng,PAR){
    const n=w*h, grains=new Uint8Array(n), age=new Uint16Array(n);
    const height=new Float32Array(n), neighbours=new Int32Array(n*4);
    let mass=0, live=0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x, p=i*4;
      height[i]=1-clamp(field.amp[i],0,1);
      neighbours[p]=y?i-w:-1;
      neighbours[p+1]=x<w-1?i+1:-1;
      neighbours[p+2]=y<h-1?i+w:-1;
      neighbours[p+3]=x?i-1:-1;
      grains[i]=rng()<0.35?1+Math.floor(rng()*2):0;
      age[i]=grains[i]?Math.floor(rng()*40):0;
      mass+=grains[i];if(grains[i])live++;
    }
    return {w,h,n,rng,grains,age,height,neighbours,V:newView(n),
      work:new Uint32Array(n), faceHeap:new Float64Array(Math.floor(n/4)),
      queue:new Int32Array(n), queued:new Uint8Array(n),
      changed:new Uint8Array(n), columnAmp:new Float32Array(w),
      selected:new Uint8Array(w),
      activity:new Float64Array(32),activityCursor:0,activityCount:0,activityTotal:0,activityEvents:0,
      toppleThreshold:clamp(Math.round(PAR.slope??4),3,8),
      sourceCount:clamp(Math.round(PAR.sources??6),1,w),
      shakeTracking:0,shakeElapsed:0,shakeRecovery:-1,shakeCount:0,
      shakeBaselineRate:0,shakeBaselineTopples:0,shakeAdded:0,shakeOut:0,shakeTopples:0,shakeCascades:0,
      colours:new Uint8Array([2,9,6,3,8,0,5,1]),
      gen:0,live,mass,initialMass:mass,
      added:0,out:0,bottomOut:0,totalAdded:0,totalOut:0,slides:0,
      avalanche:0,avalancheDuration:0,avalancheEvents:0,totalTopples:0,largestAvalanche:0};
  },
  step(S,field,PAR){
    const n=S.n, m=S.work, grains=S.grains, V=S.V, rng=S.rng;
    const H=S.height, nb=S.neighbours, changed=S.changed;
    const gravity=1+clamp(PAR.gravity??3,0,8);
    // Four outgoing grains require at least four incoming grains, even at 2.
    S.toppleThreshold=clamp(Math.round(PAR.slope??4),3,8);
    const advect=PAR.advect>=0.5;
    S.added=0;S.out=0;S.bottomOut=0;S.slides=0;S.avalanche=0;S.avalancheDuration=0;
    S.columnAmp.fill(0);S.selected.fill(0);
    changed.fill(0);
    for(let i=0;i<n;i++){
      m[i]=grains[i];
      V.flip[i]=Math.max(0,V.flip[i]-0.09);
      V.spark[i]=Math.max(0,V.spark[i]-0.12);
      V.lift[i]=Math.min(0,V.lift[i]+0.12);
      // Column peaks are refreshed from the current record without allocation.
      const x=i%S.w;
      if(field.amp[i]>S.columnAmp[x])S.columnAmp[x]=field.amp[i];
    }
    // Alternate a fixed sweep, and move at most one original top card per cell.
    // Received cards cannot get an extra turn merely because of sweep order.
    const reverse=S.gen&1, increment=reverse?-1:1;
    for(let i=reverse?n-1:0;i>=0&&i<n;i+=increment){
      if(!grains[i]||!m[i])continue;
      const own=gravity*H[i]+(m[i]-1)*0.125;
      const cx=advect?Math.cos(field.ph[i]):0;
      const cy=advect?Math.sin(field.ph[i]):0;
      let best=-1, bestPotential=Infinity, ties=0;
      for(let d=0;d<4;d++){
        const j=nb[i*4+d];
        if(j<0||m[j]>=8||H[j]>=H[i])continue;
        const landing=gravity*H[j]+m[j]*0.125;
        // The phase force may select a different downhill route, never uphill.
        if(landing>=own)continue;
        const drift=d===0?-cy:d===1?cx:d===2?cy:-cx;
        const potential=landing-(advect?0.08*drift:0);
        if(potential<bestPotential-1e-7){
          best=j;bestPotential=potential;ties=1;
        }else if(Math.abs(potential-bestPotential)<=1e-7){
          ties++;if(rng()*ties<1)best=j;
        }
      }
      if(best<0)continue;
      m[i]--;m[best]++;S.slides++;
      changed[i]=1;changed[best]=1;
      V.flip[i]=1;V.lift[best]=-0.65;
    }
    // Rain only above the K loudest columns, at most one grain per column.
    // The terrain must actually offer a downhill route; a flat or sealed
    // source emits nothing instead of silently filling an immobile board.
    const sources=clamp(Math.round(PAR.sources??6),1,S.w);
    S.sourceCount=sources;
    const feed=clamp(PAR.source??0.18,0,1);
    for(let k=0;k<sources;k++){
      const x=loudColumn(S);
      if(S.columnAmp[x]<=0||m[x]>=8)continue;
      let downhill=false;
      for(let d=0;d<4;d++){
        const j=nb[x*4+d];
        if(j>=0&&m[j]<8&&H[j]<H[x]){downhill=true;break;}
      }
      if(!downhill||rng()>=feed)continue;
      m[x]++;S.added++;changed[x]=1;V.lift[x]=-0.9;
    }
    // Same conservative relaxation is used by an ordinary generation and shake.
    relax(S,true);
    commit(S,1);
    trackActivity(S);
  },
  shake(S,field,power){
    power=clamp(power,0,1);
    if(!power)return 'burst=0 cascades=0 topples=0 out=0';
    S.shakeBaselineRate=S.activityCount?S.activityEvents/S.activityCount:0;
    S.shakeBaselineTopples=S.activityCount?S.activityTotal/S.activityCount:0;
    S.shakeTracking=1;S.shakeElapsed=0;S.shakeRecovery=-1;S.shakeCount++;
    S.added=0;S.out=0;S.bottomOut=0;S.slides=0;S.avalanche=0;S.avalancheDuration=0;
    S.columnAmp.fill(0);S.selected.fill(0);S.changed.fill(0);
    for(let i=0;i<S.n;i++){
      S.work[i]=S.grains[i];
      const x=i%S.w;
      if(field.amp[i]>S.columnAmp[x])S.columnAmp[x]=field.amp[i];
    }
    // A finite external impulse, not a persistent tilt: at full power sixteen
    // grains land in each loud source column. Only model state is touched.
    const perColumn=Math.ceil(16*power);
    for(let k=0;k<S.sourceCount;k++){
      const x=loudColumn(S);
      S.work[x]+=perColumn;S.changed[x]=1;S.added+=perColumn;
    }
    relax(S,false);
    commit(S,0);
    S.shakeAdded=S.added;S.shakeOut=S.out;S.shakeTopples=S.avalanche;
    S.shakeCascades=S.avalanche>0?1:0;
    return 'burst='+S.shakeAdded+' cascades='+S.shakeCascades+
      ' topples='+S.shakeTopples+' out='+S.shakeOut;
  },
  stats(S){return S.live;},
  view(S){
    const V=S.V,heap=S.faceHeap,limit=Math.floor(S.live/4),stride=S.n+1;
    let count=0;
    for(let i=0;i<S.n;i++){
      const m=S.grains[i];
      V.live[i]=m?1:0;V.col[i]=m?S.colours[m-1]:0;
      V.stack[i]=m?Math.min(4,m-1):0;
      V.face[i]=0;
      V.spin[i]=0;
      if(!limit||m<2||S.age[i]<40)continue;
      // Exact integer ordering: height, age, then lower cell index. A bounded
      // min-heap keeps only the tallest/oldest quarter; no sort or allocation.
      const rank=(m*65536+S.age[i])*stride+S.n-i;
      if(count<limit){
        let at=count++;
        while(at){
          const parent=(at-1)>>>1;
          if(heap[parent]<=rank)break;
          heap[at]=heap[parent];at=parent;
        }
        heap[at]=rank;
      }else if(rank>heap[0]){
        let at=0;
        while(at*2+1<count){
          let child=at*2+1;
          if(child+1<count&&heap[child+1]<heap[child])child++;
          if(heap[child]>=rank)break;
          heap[at]=heap[child];at=child;
        }
        heap[at]=rank;
      }
    }
    for(let i=0;i<count;i++)V.face[S.n-heap[i]%stride]=1;
    return V;
  },
  HUD(S){
    return 'GEN '+S.gen+' · '+S.mass+' cards · +'+S.added+' / −'+S.out+
      ' · '+S.slides+' falls · '+S.avalanche+' topples'+
      (S.shakeCount?' · shake '+S.shakeTopples+' topples · recovery '+
        (S.shakeTracking?'pending '+S.shakeElapsed+'g':S.shakeRecovery+'g'):'');
  }
});
})();
</script>
<script>
/* Two-species Gray–Scott chemistry in a record-shaped reaction vessel.
   A generation is two forward-Euler substeps, dt = 0.5, dx = 1.
   Du = 0.16; Dv = Du / dR. With dR >= 1, D*dt/dx² <= 0.08,
   below the 5-point diffusion CFL bound of 0.25. For u,v in [0,1],
   dt*(4*Du + v*v + F) <= 0.87 and dt*(4*Dv + F+k+loss) <= 0.45:
   neither species can acquire a negative Euler coefficient. Each substep
   clamps concentrations to [0,1]; clipped counts expose any lost stability.
   Edges are impermeable (missing neighbours are the cell itself).
   Cards are live at v > 0.18; four concentration bands are printed flats. */
(() => {
  const threshold = 0.18;
  // Weakest candidate first: higher V, then older age, then lower index wins.
  function weaker(S, a, b) {
    return S.v[a] < S.v[b] || (S.v[a] === S.v[b] &&
      (S.age[a] < S.age[b] || (S.age[a] === S.age[b] && a > b)));
  }
  function rankFaces(S) {
    const cap = S.live >> 2, heap = S.faceHeap, face = S.V.face;
    let count = 0;
    for (let i = 0; i < S.n; i++) {
      if (!face[i]) continue;
      face[i] = 0;
      if (!cap) continue;
      if (count < cap) {
        let at = count++;
        while (at) {
          const parent = (at - 1) >> 1;
          if (!weaker(S, i, heap[parent])) break;
          heap[at] = heap[parent];
          at = parent;
        }
        heap[at] = i;
      } else if (weaker(S, heap[0], i)) {
        let at = 0;
        while (2 * at + 1 < count) {
          let child = 2 * at + 1;
          if (child + 1 < count && weaker(S, heap[child + 1], heap[child])) child++;
          if (!weaker(S, heap[child], i)) break;
          heap[at] = heap[child];
          at = child;
        }
        heap[at] = i;
      }
    }
    for (let i = 0; i < count; i++) face[heap[i]] = 1;
  }
  function paint(S, advance = true) {
    const V = S.V;
    let live = 0, births = 0, deaths = 0;
    for (let i = 0; i < S.n; i++) {
      const v = S.v[i], delta = v - S.before[i];
      const on = v > threshold, was = V.live[i];
      V.live[i] = on ? 1 : 0;
      if (on) {
        live++;
        S.age[i] = was ? (advance && S.age[i] < 65535 ? S.age[i] + 1 : S.age[i]) : 1;
        V.col[i] = v < 0.24 ? 6 : v < 0.31 ? 2 : v < 0.39 ? 4 : 7;
        // Eyes belong to mature, concentrated cores, not every old front.
        V.face[i] = S.age[i] >= 60 && v >= 0.30 &&
          2 * v >= S.v[S.left[i]] + S.v[S.right[i]] &&
          2 * v >= S.v[S.up[i]] + S.v[S.down[i]] ? 1 : 0;
        // A falling concentration at a thin neck or front signals fission/retreat.
        // Detect onset, not every frame: the card gets a full turn then unfolds.
        if (advance) {
          const retreat = delta < -0.001 && v < 0.3;
          V.flip[i] = retreat && !S.retreat[i] ? 1 : (V.flip[i] > 0.09 ? V.flip[i] - 0.09 : 0);
          S.retreat[i] = retreat ? 1 : 0;
        }
        // The app fades sparks once per rendered frame; worlds only raise them.
        if (!was) V.spark[i] = 1;
      } else {
        S.age[i] = 0;
        S.retreat[i] = 0;
        V.face[i] = 0;
        V.flip[i] = 0;
        V.lift[i] = 0;
        V.spin[i] = 0;
      }
      if (on && !was) births++;
      if (!on && was) deaths++;
    }
    S.live = live;
    if (advance) { S.births = births; S.deaths = deaths; }
    rankFaces(S);
  }
  defWorld({
    id: 'rd', label: 'REACTION',
    blurb: 'A mask-confined two-chemical reef. Eyes: age ≥ 60, v ≥ 0.30, concave on both axes; rank higher v, older age, lower index, capped at floor(live/4). Near-static sparse regimes: GSFC spectro has 2 births/1 retreat in steps 1801–2000; HST has 17 cards on 143 substrate cells at step 120.',
    params: [
      { key: 'F', label: 'feed F', min: 0.01, max: 0.09, step: 0.001, def: 0.037 },
      { key: 'k', label: 'kill k', min: 0.04, max: 0.07, step: 0.001, def: 0.06 },
      { key: 'dR', label: 'diffusion U / V', min: 1, max: 4, step: 0.05, def: 2 },
      { key: 'drive', label: 'record modulation', min: 0, max: 1, step: 0.05, def: 0.6 }
    ],
    init(w, h, field, rng, PAR) {
      const n = w * h;
      const S = {
        w, h, n, gen: 0, live: 0, births: 0, deaths: 0, clipped: 0,
        rng, shakePending: false,
        u: new Float32Array(n), v: new Float32Array(n),
        un: new Float32Array(n), vn: new Float32Array(n),
        before: new Float32Array(n), age: new Uint16Array(n),
        retreat: new Uint8Array(n),
        faceHeap: new Int32Array(n),
        left: new Int32Array(n), right: new Int32Array(n),
        up: new Int32Array(n), down: new Int32Array(n), V: newView(n)
      };
      const modulation = clamp(PAR.drive ?? 0.6, 0, 1);
      S.u.fill(1);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x;
        S.left[i] = x ? i - 1 : i;
        S.right[i] = x < w - 1 ? i + 1 : i;
        S.up[i] = y ? i - w : i;
        S.down[i] = y < h - 1 ? i + w : i;
      }
      // Independent nuclei make modulation=0 a genuine record-free control.
      // Draw the same random numbers regardless of the field or modulation.
      for (let y = 2; y < h - 2; y += 7) for (let x = 2; x < w - 2; x += 7) {
        const chance = rng(), jitter = rng();
        const cx = clamp(x + (jitter * 3 | 0) - 1, 1, w - 2);
        const cy = clamp(y + (rng() * 3 | 0) - 1, 1, h - 2);
        const i = cy * w + cx;
        const record = modulation * field.mask[i];
        if (chance > 0.14 + 0.64 * record) continue;
        for (let yy = cy - 1; yy <= cy + 1; yy++) for (let xx = cx - 1; xx <= cx + 1; xx++) {
          const j = yy * w + xx;
          S.v[j] = 0.27 + 0.04 * jitter;
          S.u[j] = 1 - S.v[j];
        }
      }
      // Weak background substrate plus discrete nuclei avoids exciting a dense
      // mask all at once into a uniform slab (and its synchronized collapse).
      for (let i = 0; i < n; i++) if (modulation > 0 && field.mask[i]) {
        S.v[i] = Math.max(S.v[i], modulation * (0.025 + 0.025 * field.amp[i]));
        S.u[i] = 1 - S.v[i];
      }
      S.before.set(S.v);
      paint(S);
      S.births = 0;
      return S;
    },
    shake(S, field, power) {
      const kick = clamp(power, 0, 1);
      const beforeLive = S.live, beforeBirths = S.births, beforeDeaths = S.deaths;
      let injected = 0;
      if (kick > 0) {
        // Select a seeded frontier without allocating an eligible-cell list.
        let eligible = 0;
        for (let i = 0; i < S.n; i++) if (field.mask[i] && S.v[i] >= 0.14 && S.v[i] < 0.30) eligible++;
        const frontier = eligible > 0;
        if (!frontier) for (let i = 0; i < S.n; i++) if (field.mask[i]) eligible++;
        if (eligible) {
          let pick = S.rng() * eligible | 0, centre = 0;
          for (let i = 0; i < S.n; i++) {
            if (!field.mask[i] || (frontier && (S.v[i] < 0.14 || S.v[i] >= 0.30))) continue;
            if (pick-- === 0) { centre = i; break; }
          }
          const cx = centre % S.w, cy = centre / S.w | 0;
          const radius = Math.max(2, 0.045 * Math.min(S.w, S.h)) * (0.5 + 0.5 * kick);
          const radius2 = radius * radius, pulse = 0.025 * kick;
          const x0 = Math.max(0, Math.floor(cx - radius)), x1 = Math.min(S.w - 1, Math.ceil(cx + radius));
          const y0 = Math.max(0, Math.floor(cy - radius)), y1 = Math.min(S.h - 1, Math.ceil(cy + radius));
          S.before.set(S.v);
          S.births = 0; S.deaths = 0;
          for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
            const i = y * S.w + x, distance2 = (x - cx) ** 2 + (y - cy) ** 2;
            if (!field.mask[i] || distance2 >= radius2) continue;
            const old = S.v[i];
            // A bounded chemical injection, not a cell-state or view override.
            S.v[i] = old + pulse * (1 - distance2 / radius2) * (1 - old);
            injected += S.v[i] - old;
            if (old <= threshold && S.v[i] > threshold) { S.live++; S.births++; }
          }
          S.shakePending = true;
        }
      }
      return 'kick ' + kick.toFixed(2) + ' · reef ' + beforeLive + '→' + S.live +
        ' · births ' + beforeBirths + '→' + S.births + ' · retreats ' + beforeDeaths + '→' + S.deaths +
        ' · V+ ' + injected.toFixed(4);
    },
    step(S, field, PAR) {
      if (S.shakePending) { paint(S, false); S.shakePending = false; }
      const feed = clamp(PAR.F ?? 0.037, 0.01, 0.09);
      const kill = clamp(PAR.k ?? 0.06, 0.04, 0.07);
      const dv = 0.16 / clamp(PAR.dR ?? 2, 1, 4);
      const mod = clamp(PAR.drive ?? 0.6, 0, 1);
      S.before.set(S.v);
      for (let sub = 0; sub < 2; sub++) {
        const U = S.u, V = S.v, un = S.un, vn = S.vn;
        for (let i = 0; i < S.n; i++) {
          const left = S.left[i], right = S.right[i], up = S.up[i], down = S.down[i];
          const u = U[i], v = V[i];
          // These coefficients are read from the live record every generation.
          // Amplitude increases both supply and turnover. Off-mask substrate
          // loses V, so diffusion can spill across an edge but cannot colonize it.
          const signal = field.mask[i] ? 0.25 + 0.75 * field.amp[i] : 0;
          const localFeed = feed + mod * 0.016 * (signal - 0.4);
          const localKill = kill + mod * 0.002 * (signal - 0.3);
          const loss = mod * 0.08 * (1 - field.mask[i]);
          const F = localFeed < 0.005 ? 0.005 : localFeed > 0.1 ? 0.1 : localFeed;
          const k = localKill < 0.04 ? 0.04 : localKill > 0.075 ? 0.075 : localKill;
          const reaction = u * v * v;
          const nextU = u + 0.5 * (0.16 * (U[left] + U[right] + U[up] + U[down] - 4 * u) - reaction + F * (1 - u));
          const nextV = v + 0.5 * (dv * (V[left] + V[right] + V[up] + V[down] - 4 * v) + reaction - (F + k + loss) * v);
          if (nextU < 0 || nextU > 1 || nextV < 0 || nextV > 1) S.clipped++;
          un[i] = nextU < 0 ? 0 : nextU > 1 ? 1 : nextU;
          vn[i] = nextV < 0 ? 0 : nextV > 1 ? 1 : nextV;
        }
        S.u = un; S.un = U;
        S.v = vn; S.vn = V;
      }
      S.gen++;
      paint(S);
    },
    stats(S) { return S.live; },
    view(S) {
      if (S.shakePending) { paint(S, false); S.shakePending = false; }
      return S.V;
    },
    HUD(S) { return 'reef ' + S.live + ' · births ' + S.births + ' · retreats ' + S.deaths + ' · step ' + S.gen; }
  });
})();
</script>
<script>
/* Conway's family on a record-shaped seed, with optional live row-loudness rules. */
(() => {
  const rules = [
    ['LIFE', '3', '23', '#57ac4a'],
    ['HIGHLIFE', '36', '23', '#4c93d8'],
    ['MAZE', '3', '12345', '#d4527e'],
    ['2×2', '36', '125', '#9c8b5a'],
    ['CORAL', '3', '45678', '#e8613c'],
    ['DIAMOEBA', '35678', '5678', '#2fb3a6'],
    ['DAY&NIGHT', '3678', '34678', '#8a63d2'],
    ['SEEDS', '2', '', '#f6c344']
  ];
  function mask(digits) {

/* Pure mapping from a prepared complex record to audible control values.
   The signal's source frequency is sub-audible; the output is an intentional
   sonification, never a claim that the numerical-relativity file is audio. */
const SONIFY_SCALE=[0,2,4,7,9]; // C major pentatonic, repeated over two octaves
function sonifyFrame(rec,index,mode,out){
  out=out||{};
  if(!rec||!rec.re||!rec.re.length){
    out.level=0;out.pitch=110;out.pan=0;out.brightness=0;
    out.sourceHz=0;out.noteStep=0;return out;
  }
  const n=rec.re.length,i=clamp(index|0,0,n-1);
  const re=rec.re[i],im=rec.im?rec.im[i]:0;
  const mag=Math.hypot(re,im),level=clamp((rec.amp?rec.amp[i]:mag)/(rec.amax||1),0,1);
  const phase=rec.ph?rec.ph[i]:Math.atan2(im,re);
  const prev=rec.ph&&i?rec.ph[i-1]:phase;
  const dt=rec.t&&i?rec.t[i]-rec.t[i-1]:1;
  const sourceHz=i&&dt>0?Math.abs(phase-prev)/(2*Math.PI*dt):0;
  const turns=Math.abs(phase-(rec.ph?rec.ph[0]:0));
  const step=rec.turns>=0.25?Math.floor(turns/(Math.PI/2)):Math.floor(level*10);
  const degree=step%SONIFY_SCALE.length,octave=Math.floor(step/SONIFY_SCALE.length)%2;
  const melodic=130.81278265*Math.pow(2,(SONIFY_SCALE[degree]+12*octave)/12);
  out.pitch=mode==='music'?melodic:clamp(110+5500*sourceHz,110,800);
  out.level=level;
  out.pan=mag>1e-9?clamp(re/mag,-0.75,0.75):0;
  out.brightness=level;
  out.sourceHz=sourceHz;
  out.noteStep=step;
  return out;
}

/* LIFE turns each live column into a complex phasor. Its vertical positions
   set the phasor angle; neighbouring columns are averaged so isolated births
   change a contour rather than making a single-pixel spike. The original
   record remains the quiet backbone of the output wave. Nothing here edits it
   or the field driving the automaton. */
function lifeFeedback(rec,S){
  if(!rec||!rec.re||!S||!S.st)return null;
  const {w,h,st}=S,n=rec.re.length,peak=rec.amax||1;
  const columnsRe=new Float64Array(w),columnsIm=new Float64Array(w);
  let live=0;
  for(let y=0;y<h;y++){
    const angle=2*Math.PI*(y+0.5)/h,c=Math.cos(angle),s=Math.sin(angle);
    for(let x=0;x<w;x++)if(st[y*w+x]){
      columnsRe[x]+=c;columnsIm[x]+=s;live++;
    }
  }
  const smoothRe=new Float64Array(w),smoothIm=new Float64Array(w);
  let maxColumn=0,globalRe=0,globalIm=0;
  for(let x=0;x<w;x++){
    const left=(x+w-1)%w,right=(x+1)%w;
    smoothRe[x]=(columnsRe[left]+2*columnsRe[x]+columnsRe[right])/4;
    smoothIm[x]=(columnsIm[left]+2*columnsIm[x]+columnsIm[right])/4;
    maxColumn=Math.max(maxColumn,Math.hypot(smoothRe[x],smoothIm[x]));
    globalRe+=smoothRe[x];globalIm+=smoothIm[x];
  }
  const activity=clamp(Math.sqrt(live/Math.max(1,w*h*0.08)),0,1);
  const globalMag=Math.max(1,Math.hypot(globalRe,globalIm));
  const re=new Float64Array(n),im=new Float64Array(n);
  for(let i=0;i<n;i++){
    const x=i%w,textureRe=maxColumn?smoothRe[x]/maxColumn:0,
      textureIm=maxColumn?smoothIm[x]/maxColumn:0;
    re[i]=activity*(0.35*rec.re[i]+0.65*peak*(0.8*textureRe+0.2*globalRe/globalMag));
    im[i]=activity*(0.35*rec.im[i]+0.65*peak*(0.8*textureIm+0.2*globalIm/globalMag));
  }
  const wave=prepRecord({kind:'complex',name:'LIFE feedback',re,im,t:rec.t});
  wave.amax=peak; // a fixed scale makes a shrinking or extinct colony quieter
  wave.live=live;wave.activity=activity;
  return wave;
}

/* The same complex feedback wave shown by the scope controls the synth.
   The source phase still establishes the musical idea; cell positions bend
   pitch and pan, while the feedback wave's amplitude sets loudness. */
function sonifyLifeFrame(rec,feedback,index,mode,out){
  out=sonifyFrame(rec,index,mode,out);
  if(!feedback)return out;
  const i=clamp(index|0,0,feedback.re.length-1),peak=rec.amax||1;
  const re=feedback.re[i]/peak,im=feedback.im[i]/peak;
  const bend=clamp(0.5*re+0.25*im,-0.6,0.6);
  const semitones=mode==='music'?Math.round(bend*5):bend*12;
  out.pitch=clamp(out.pitch*Math.pow(2,semitones/12),90,1000);
  out.level=clamp(feedback.amp[i]/peak,0,1);
  out.pan=clamp(re,-0.75,0.75);
  out.brightness=out.level;
  return out;
}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   w-render.js — the paper-craft renderer. DOM side (with w-app.js).
   Draws the sheet and its cards. It knows nothing
   about any particular world: a world hands over a view, the renderer draws
   exactly one card per live cell and nothing else.
   ═══════════════════════════════════════════════════════════════════════════ */
const R = { W:0, H:0, side:0, bx:0, by:0, M:52, cs:11, clock:0, bob:1,
            sparkBudget:8, slipScale:1, inkKey:[1,1,1], gain:1.75 };

function stageCtx(){
  const cv=document.getElementById('stage');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=window.innerWidth,H=window.innerHeight;
  R.W=W;R.H=H;
  const w=Math.max(1,Math.round(W*dpr)),h=Math.max(1,Math.round(H*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  cv.style.width=W+'px';cv.style.height=H+'px';
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return ctx;
}
function setM(M){R.M=M;R.cs=R.side/M;}

/* ── THE PRESS ───────────────────────────────────────────────────────────────
   Nothing below paints a card's colour. Three inks are laid as separate
   plates — BLUE, FLUORESCENT PINK, YELLOW — each halftoned on its own screen
   angle, each shifted by its own seeded registration error, and the sheet is
   the product of the three. A card is never filled with the colour it looks
   like: it is separated into how much of each ink that colour takes (see the
   separation, below), and the colour happens on the paper. The cut line and
   the eyes print on blue AND pink, so even the near-black is two inks meeting.
   Change the seed and the same board re-prints with different registration
   slip and different grain — the press pulls another copy. */
const INKS=[{hex:[31,111,198],ang:15*Math.PI/180},      /* blue */
            {hex:[255,79,176],ang:75*Math.PI/180},      /* fluorescent pink */
            {hex:[255,210,30],ang:45*Math.PI/180}];     /* yellow */
/* ── the separation ──────────────────────────────────────────────────────────
   No card is painted in the colour it appears to be. Every colour the app
   names is SEPARATED here: the press searches how much of each of its three
   inks, screened and overprinted on this paper, lands closest to that colour,
   and prints that. Worlds are free to invent colours at runtime (LIFE pushes
   four per rule); they get separated the same way, because the separation is a
   function of the colour, not a table someone kept in sync by hand.
   Measured by tools/ink-fit.mjs against the twelve flats: a hand-kept on/off
   table was mean dE 79.65 (worst 139.39); this search is mean dE 12.02
   (worst 27.71, all five misses are greens and violets that blue+pink+yellow
   genuinely cannot reach). */
const PAPER=[243,236,221], DOT=2.6;
const COV=[];for(let i=0;i<=32;i++)COV.push(i/32);
/* inked area is not linear in a plate's value: the dots overlap. Measure the
   real curve off the same law pullSheet() screens with. */
const AREA=COV.map(c=>{
  if(c<=0)return 0;
  const r2=c*DOT*DOT*0.66, N=48;
  let hit=0;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x=(i+0.5)/N*DOT, y=(j+0.5)/N*DOT;
    let best=Infinity;
    for(const cx of [0,DOT])for(const cy of [0,DOT]){
      const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);if(d<best)best=d;
    }
    if(best<=r2)hit++;
  }
  return hit/(N*N);
});
function srgbLin(v){v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);}
function toLab(c){
  const r=srgbLin(c[0]),g=srgbLin(c[1]),b=srgbLin(c[2]);
  let X=(r*0.4124+g*0.3576+b*0.1805)/0.95047;
  let Y=(r*0.2126+g*0.7152+b*0.0722);
  let Z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const k=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  X=k(X);Y=k(Y);Z=k(Z);
  return [116*Y-16,500*(X-Y),200*(Y-Z)];
}
/* Every colour this press can physically make, built once: 33^3 coverage
   triples, each carried through the same overprint the sheet uses and stored
   in Lab. Separating a colour is then one nearest-neighbour scan of this
   gamut — which is the honest statement of what the press is. */
let GAMUT=null;
function buildGamut(){
  const n=COV.length, N=n*n*n;
  const L=new Float32Array(N),A=new Float32Array(N),B=new Float32Array(N);
  const ci=new Uint8Array(N*3);
  let k=0;
  for(let bi=0;bi<n;bi++){
    const ab=AREA[bi], i0=INKS[0].hex;
    const b0=PAPER[0]*(1-ab)+PAPER[0]*(i0[0]/255)*ab;
    const b1=PAPER[1]*(1-ab)+PAPER[1]*(i0[1]/255)*ab;
    const b2=PAPER[2]*(1-ab)+PAPER[2]*(i0[2]/255)*ab;
    for(let pi=0;pi<n;pi++){
      const ap=AREA[pi], i1=INKS[1].hex;
      const p0=b0*(1-ap)+b0*(i1[0]/255)*ap;
      const p1=b1*(1-ap)+b1*(i1[1]/255)*ap;
      const p2=b2*(1-ap)+b2*(i1[2]/255)*ap;
      for(let yi=0;yi<n;yi++,k++){
        const ay=AREA[yi], i2=INKS[2].hex;
        const lab=toLab([p0*(1-ay)+p0*(i2[0]/255)*ay,
                         p1*(1-ay)+p1*(i2[1]/255)*ay,
                         p2*(1-ay)+p2*(i2[2]/255)*ay]);
        L[k]=lab[0];A[k]=lab[1];B[k]=lab[2];
        ci[k*3]=bi;ci[k*3+1]=pi;ci[k*3+2]=yi;
      }
    }
  }
  GAMUT={L:L,A:A,B:B,ci:ci,n:N};
}
const SEP=new Map();
function separate(hex){
  let s=SEP.get(hex);
  if(s)return s;
  if(!GAMUT)buildGamut();
  const w=toLab(hex2rgb(hex)), wl=w[0],wa=w[1],wb=w[2];
  const G=GAMUT;
  let bi=0,be=Infinity;
  for(let i=0;i<G.n;i++){
    const dl=G.L[i]-wl, da=G.A[i]-wa, db=G.B[i]-wb;
    const e=dl*dl+da*da+db*db;
    if(e<be){be=e;bi=i;}
  }
  s=[COV[G.ci[bi*3]],COV[G.ci[bi*3+1]],COV[G.ci[bi*3+2]]];
  s.dE=Math.sqrt(be);
  SEP.set(hex,s);
  return s;
}
/* what a recipe actually puts on the paper */
function inkedHex(cov){
  const o=PAPER.slice();
  for(let p=0;p<3;p++){
    const a=AREA[Math.round(cov[p]*32)];
    if(!a)continue;
    for(let ch=0;ch<3;ch++)o[ch]=o[ch]*(1-a)+(o[ch]*INKS[p].hex[ch]/255)*a;
  }
  return '#'+o.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
}
/* the separation for a palette index, cached: PAL grows at runtime */
const SEPI=[];
function recipeFor(ci){
  const idx=ci%PAL.length;
  return SEPI[idx]||(SEPI[idx]=separate(PAL[idx]));
}
/* Align the palette with the press. A shop cannot name a colour it cannot
   print: every flat is replaced by what these three inks actually lay down
   for it, so the chip in the rail, the proof panel and the pulled sheet are
   the same colour rather than three opinions about one. Called once at boot,
   after the worlds have pushed the colours they invent. The press loses the
   saturated greens and teals that blue+yellow cannot reach — that loss is the
   press's character, and it is now visible everywhere instead of only on the
   sheet. */
function snapPalette(){
  for(let i=0;i<PAL.length;i++){
    const cov=separate(PAL[i]);
    PAL[i]=inkedHex(cov);
    SEPI[i]=cov;
  }
}
function printSeed(){
  return (typeof APP!=='undefined'&&APP&&APP.seed!=null)?(APP.seed|0):1;
}
/* Registration is something the operator brings in at makeready, not a fixed
   property of the press: R.slipScale multiplies every plate's slip, so 0 is a
   press that is somehow in register (or a shop that has not started yet) and 3
   is a sheet to throw away. The seeded draw is unchanged, so scaling the slip
   never changes which way each plate went out. */
function slips(seed){
  const r=mulberry32(seed^0x9e37c1), s=R.slipScale==null?1:R.slipScale;
  /* s is one number for the whole press, or one PER PLATE: the operator's three
     register pins each walk their own plate, so the shop asks for three. The
     seeded draw is unchanged either way — scaling the slip never changes which
     way each plate went out. */
  return INKS.map((ink,p)=>{
    const sp=(s&&s.length)?(s[p]==null?1:s[p]):s;
    return {dx:(r()*2-1)*2.1*sp,dy:(r()*2-1)*2.1*sp};
  });
}
/* The registration error actually in force, in device pixels: the largest
   distance between any two of the three plates. This is the number the proof
   prints and the operator reads off the registration targets — one number for
   "how far out is this sheet", not six offsets. */
function measuredSlip(seed){
  const sl=slips(seed==null?printSeed():seed|0);
  let worst=0;
  for(let i=0;i<sl.length;i++)
    for(let j=i+1;j<sl.length;j++)
      worst=Math.max(worst,Math.hypot(sl[i].dx-sl[j].dx,sl[i].dy-sl[j].dy));
  return worst;
}
function plates(side){
  if(!R._pl||R._pl.side!==side){
    R._pl={side:side,c:[0,1,2].map(()=>{
      const c=document.createElement('canvas');c.width=side;c.height=side;return c;})};
  }
  return R._pl.c;
}
/* one card, drawn as coverage (white on black) onto whichever plates print it */
function pcard(c,X,Y,w,h,alpha){
  if(w<0.7||alpha<=0.02)return;
  const r=Math.max(1.2,w*0.22);
  c.globalAlpha=alpha;rr(c,X,Y,w,h,r);c.fill();
}
function pline(c,X,Y,w,h,lw,alpha){
  if(w<0.7)return;
  const r=Math.max(1.2,w*0.22);
  c.globalAlpha=alpha;c.lineWidth=lw;rr(c,X,Y,w,h,r);c.stroke();
}
function peyes(c,X,Y,w,h,alpha){
  /* nothing finer than the screen ruling survives the halftone, so a pupil is
     never drawn smaller than one dot — the same rule a printer works to */
  const r=Math.max(DOT*0.78,w*0.115);
  c.globalAlpha=alpha;
  c.beginPath();c.arc(X+w*0.35,Y+h*0.44,r,0,6.2832);
  c.arc(X+w*0.66,Y+h*0.44,r,0,6.2832);c.fill();
}
function pstar(c,cx,cy,r,al){
  if(al<=0.03)return;
  c.globalAlpha=Math.min(1,al);c.lineWidth=Math.max(0.8,r*0.16);
  c.beginPath();
  c.moveTo(cx-r,cy);c.lineTo(cx+r,cy);c.moveTo(cx,cy-r);c.lineTo(cx,cy+r);
  c.moveTo(cx-r*0.55,cy-r*0.55);c.lineTo(cx+r*0.55,cy+r*0.55);
  c.moveTo(cx+r*0.55,cy-r*0.55);c.lineTo(cx-r*0.55,cy+r*0.55);
  c.stroke();
}
/* lay every card down on its plates */
function inkCards(pc,V,M,cs){
  const bobOn=R.bob?cs*0.055:0;
  let burst=Math.max(0,R.sparkBudget|0), sparkOn=cs>=7;
  const lw=Math.max(DOT,cs*0.085);   /* a cut line thinner than the screen prints as nothing */
  for(let y=0,i=0;y<M;y++){
    for(let x=0;x<M;x++,i++){
      const live=V.live[i],fl=V.flip[i];
      if(!live&&fl<=0)continue;
      const bob=bobOn*Math.sin(R.clock*2.1+x*0.8+y*0.55);
      const X=x*cs, Y=y*cs+V.lift[i]*cs+bob;
      const rec=recipeFor(V.col[i]);   /* how much of each ink this colour is */
      if(sparkOn&&burst>0&&V.spark[i]>0){       /* births pop on yellow alone */
        pstar(pc[2],X+cs/2,Y+cs/2,cs*0.34,V.spark[i]);burst--;
      }
      if(live){
        const up=V.stack?V.stack[i]:0;
        if(up)for(let s=up;s>=1;s--){
          const o=s*cs*0.20, inset=s*cs*0.05;
          for(let p=0;p<3;p++)if(rec[p]>0)
            pcard(pc[p],X+inset,Y-o+inset,cs-inset*2,cs-inset*2,rec[p]*0.72);
        }
        for(let p=0;p<3;p++)if(rec[p]>0)pcard(pc[p],X,Y,cs,cs,rec[p]);
        /* the cut line and the eyes print on blue AND pink, so the dark comes
           from two inks meeting, never from a dark fill */
        pline(pc[0],X,Y,cs,cs,lw,0.55);pline(pc[1],X,Y,cs,cs,lw,0.55);
        if(V.face[i]&&cs>=8){peyes(pc[0],X,Y,cs,cs,0.95);peyes(pc[1],X,Y,cs,cs,0.95);}
      }
      if(fl>0){
        const t=Math.min(1,fl), sx=cs*Math.abs(Math.cos(t*Math.PI*0.5));
        for(let p=0;p<3;p++)if(rec[p]>0)
          pcard(pc[p],X+(cs-sx)/2,Y-t*cs*0.5,sx,cs,rec[p]*(1-t*0.9));
      }
    }
  }
}
/* halftone the three plates and overprint them onto the sheet.
   Per-pixel rather than per-dot: for each pixel find its screen cell at that
   plate's angle, read the plate's coverage at the cell centre, and ink the
   pixel if it falls inside a dot of radius sqrt(coverage). */
/* Screen centres only move when a register pin or sheet size changes. Keep
   one map per plate, not per seed or frame; old maps are replaced in place.
   Float64 preserves the original dot-boundary decisions exactly. */
function screenMap(S,p,sl){
  const maps=R._screens||(R._screens=[]);
  let m=maps[p];
  if(m&&m.S===S&&m.dx===sl.dx&&m.dy===sl.dy)return m;
  if(!m||m.S!==S)m=maps[p]={S:S,index:new Int32Array(S*S),distance:new Float64Array(S*S)};
  m.dx=sl.dx;m.dy=sl.dy;
  const ca=Math.cos(INKS[p].ang),sa=Math.sin(INKS[p].ang),cx=S/2,cy=S/2;
  for(let y=0,i=0;y<S;y++)for(let x=0;x<S;x++,i++){
    const fx=x-sl.dx-cx,fy=y-sl.dy-cy;
    const u=fx*ca+fy*sa,v=-fx*sa+fy*ca;
    const su=Math.round(u/DOT)*DOT,sv=Math.round(v/DOT)*DOT;
    const sx=su*ca-sv*sa+cx+sl.dx,sy=su*sa+sv*ca+cy+sl.dy;
    const gx=sx|0,gy=sy|0,dx=x-sx,dy=y-sy;
    m.index[i]=gx<0||gy<0||gx>=S||gy>=S?-1:(gy*S+gx)*4;
    m.distance[i]=dx*dx+dy*dy;
  }
  return m;
}
function pullSheet(ctx,side,ox,oy,seed){
  const S=Math.max(1,Math.round(side));
  const pc=plates(S), sl=slips(seed);
  const cov=[];
  for(let p=0;p<3;p++)cov.push(pc[p].getContext('2d').getImageData(0,0,S,S).data);
  let buf=R._sheet;
  if(!buf||buf.S!==S)buf=R._sheet={S:S,out:ctx.createImageData(S,S),grain:new Float64Array(S*S)};
  if(buf.seed!==seed){
    const gr=mulberry32(seed^0x51ed27);
    for(let i=0;i<buf.grain.length;i++)buf.grain[i]=(gr()*2-1)*9;
    buf.seed=seed;
  }
  const out=buf.out,od=out.data;
  for(let i=0,px=0;px<S*S;px++){
    od[i++]=PAPER[0];od[i++]=PAPER[1];od[i++]=PAPER[2];od[i++]=255;
  }
  for(let p=0;p<3;p++){
    const d=cov[p],map=screenMap(S,p,sl[p]),key=R.inkKey?R.inkKey[p]:1;
    const ir=INKS[p].hex[0]/255,ig=INKS[p].hex[1]/255,ib=INKS[p].hex[2]/255;
    for(let i=0,o=0;i<map.index.length;i++,o+=4){
      const at=map.index[i];
      if(at<0)continue;
      const c=(d[at]/255)*key;
      if(c<=0.03||map.distance[i]>c*DOT*DOT*0.66)continue;
