name: Deploy automata.lllgoyour.com via FTP

on:
  push:
    branches: [master]
    paths:
      - site/**
      - scripts/deploy_ftp.py
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automata-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: automata
      url: https://automata.lllgoyour.com
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -s site/index.html
          test -s site/data.js
          test -s site/strain-worlds/index.html

      - name: Upload website without deleting remote files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: /automata
        run: python3 scripts/deploy_ftp.py

      # GitHub runners can receive a Cloudflare bot challenge (403) even when
      # visitors can load the site. Check the origin's HTTPS vhost directly.
      - name: Verify origin HTTPS website
        env:
          ORIGIN_IP: ${{ secrets.FTP_SERVER }}
        run: |
          if ! curl --fail --silent --show-error --location --max-time 30 \
            --resolve "automata.lllgoyour.com:443:${ORIGIN_IP}" \
            --output /tmp/automata-home.html https://automata.lllgoyour.com/; then
            echo '::error::The origin HTTPS virtual host must serve /automata and have a certificate for automata.lllgoyour.com.'
            exit 1
          fi
          if ! grep -q '<title>Black Hole Loom</title>' /tmp/automata-home.html; then
            echo '::error::Origin HTTPS responds, but does not serve site/index.html from /automata.'
            exit 1
          fi
