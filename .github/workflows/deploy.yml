name: Deploy automata.lllgoyour.com via FTP

on:
  push:
    branches: [master]
    paths:
      - site/**
      - scripts/deploy_ftp.py
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automata-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: automata
      url: https://automata.lllgoyour.com
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -s site/index.html
          test -s site/data.js

      - name: Upload website without deleting remote files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python3 scripts/deploy_ftp.py
