<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>the press takes commissions</title>
<style>
/* +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
The page is a sheet of paper and the machine printed on it. There is no markup
here to style: every instrument, every label and every moving part on screen is
drawn by the workshop modules in the press's own three inks, on this paper, with the
same halftone screens as the sheet it produces. The only thing in the body is
the canvas the machine is printed on, one offscreen file input (the plumbing
behind a physical hotspot - a file picker cannot be drawn), and the scripts.
+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ */
:root{ --paper:#f3ecdd; --ink:#241a12; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
  color:var(--ink);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{display:block;width:100vw;height:100vh}
/* the file picker is the one thing a canvas cannot draw. It is never shown:
   the source desk and press feed board both open it. The source desk loads a
   record directly; the press leaves a physical file on its feed board. */
#f_any{position:fixed;left:-4px;top:-4px;width:1px;height:1px;opacity:0;border:0;
  padding:0;margin:0;pointer-events:none}
</style></head><body>
<canvas id="stage"></canvas>
<input id="f_any" type="file" aria-hidden="true" tabindex="-1">
<!-- classic scripts, in load order: works straight off file:// -->
<script src="src/core.js"></script>
<script src="src/w-field.js"></script>
<script src="src/w-synch.js"></script>
<script src="src/w-grav.js"></script>
<script src="src/w-rd.js"></script>
<script src="src/w-life.js"></script>
<script src="src/data-gsfc.js"></script>
<script src="src/w-sonify.js"></script>
<script src="src/w-render.js"></script>
<script src="src/w-shop.js"></script>
<script src="src/w-room.js"></script>
<script src="src/w-stock.js"></script>
<script src="src/w-ink.js"></script>
<script src="src/w-app.js"></script>
</body></html>
